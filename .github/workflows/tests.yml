name: tests
# Smoke test on every pull request into main and every push to main (Render
# auto-deploys main, so a red run on main means production may be on a bad build).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # an explicit permissions block zeroes the defaults - checkout needs this
  issues: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test (boot, unknown tokens 404, traversal, unknown path)
        env:
          PYTHONUTF8: "1"
        run: python tests/smoke_test.py
      - name: Open issue when red on main
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'ci-red', state: 'open'});
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'tests failed on main - the signing service may have a bad deploy',
                labels: ['ci-red'],
                body: 'Commit ' + context.sha.slice(0, 7) + ' failed the smoke test.\n\n' +
                      'Render deploys main on push: check https://pisgat-liam-sign.onrender.com/healthz ' +
                      'and roll back in the Render dashboard if needed.\n\n' +
                      'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                      context.repo.repo + '/actions/runs/' + context.runId});
            }
