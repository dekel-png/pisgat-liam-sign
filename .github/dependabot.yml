# Dependency freshness + CVE patches as PRs. Every PR runs the smoke test and
# the gitleaks scan before merge; main auto-deploys to Render, so review first.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    labels: ["deps"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    labels: ["deps"]
